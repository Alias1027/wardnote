name: Android problem / Android 问题
description: Report a reproducible Android preview problem using synthetic data / 仅用虚构资料反馈 Android 预览版问题
title: "[Android] "
body:
  - type: markdown
    attributes:
      value: |
        Use fictional records only. Do not attach patient information, recordings, backups, credentials, signing material or unfiltered logs. For security issues, follow SECURITY.md and request a private channel.
        仅使用虚构资料；勿上传患者信息、录音、备份、密码、签名资料或未筛选日志。安全问题依 SECURITY.md 私密报告。当前尚未经真机或临床验证，机构/商业使用须取得许可。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope / 隐私与范围
      options:
        - label: I used only synthetic records and removed confidential details / 我仅用虚构记录且已移除敏感内容
          required: true
        - label: This is not a public vulnerability disclosure / 这不是公开漏洞披露
          required: true
  - type: input
    id: app_version
    attributes:
      label: App version and source / 应用版本及来源
      description: APK version, source revision if relevant, and where obtained; do not include private URLs/tokens / 写明APK版本、必要时源码修订和来源，勿含私密链接或令牌
      placeholder: Android 0.1.2-preview, official APK / Android 0.1.2-preview，原交付APK
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model / 手机型号
      description: Model only; no serial number, IMEI or account identifier / 仅型号，不填序列号、IMEI或账号标识
    validations:
      required: true
  - type: input
    id: android_webview
    attributes:
      label: Android and WebView versions / Android 与 WebView 版本
      description: Include Android version and Android System WebView/browser provider version; write unknown if unavailable / 写明Android和WebView提供程序版本，无法找到可写未知
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Recorder and document provider / 录音应用与文件提供程序
      description: App names/versions, local or cloud-backed destination, and relevant permissions; write not applicable if unrelated / 录音及文件应用名称版本、本地或云端位置、相关权限，无关可写不适用
      placeholder: Recorder / 录音应用；Document picker/provider / 文件选择器及提供程序；Local/removable/cloud / 本地、移动存储或云端
    validations:
      required: true
  - type: textarea
    id: installation
    attributes:
      label: Install/update path and account mode / 安装升级方式及账号模式
      description: Fresh install or previous version → current; retained/re-signed APK; whether data was cleared; personal/institutional mode; no usernames / 全新安装或旧版→新版、原签名或自签名、是否清过数据、个人或机构模式，不填账号名
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps with fictional data / 虚构资料复现步骤
      description: State offline/airplane-mode conditions if relevant / 相关时注明脱机或飞行模式
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result / 预期与实际结果
      description: Include exact non-sensitive error text and whether unsaved input remained; do not attach backups/audio / 填非敏感错误文字及未保存内容是否保留，不附备份或音频
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized evidence / 可选脱敏证据
      description: Only fictional screenshots and selected non-sensitive messages; no raw logs or patient content / 仅虚构截图及筛选的非敏感提示，勿附完整日志或患者内容
